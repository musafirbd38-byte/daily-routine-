name: Build Daily Routine APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "daily-routine",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/cli": "^7.4.3",
              "@capacitor/android": "^7.4.3"
            }
          }
          EOF

      - name: Install dependencies
        run: npm install

      - name: Create Capacitor project
        run: npx cap init "Daily Routine" "com.dailyroutine.app" --web-dir=www

      - name: Add Android
        run: npx cap add android

      - name: Copy web files
        run: npx cap copy android

      - name: Update Android
        run: npx cap update android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Routine-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
